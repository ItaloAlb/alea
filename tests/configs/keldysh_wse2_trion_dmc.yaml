# Monolayer WSe2 negative trion (X^-): Rytova–Keldysh potential, Hartree atomic units.
# 2 electrons (opposite spins, nodeless spatial singlet) + 1 hole, net charge -1.
# r0[Bohr] = r0[Å] / 0.529177;  masses in m0;  trion binding = E(exciton) - E(trion).
#
# Jastrow parameters were obtained by linear-method optimization of this trial
# (e-h and e-e Padé u(r)=a1 r/(1+b1 r)) against the trion Hamiltonian; the
# exciton-tuned exp(c r) is a poor trion trial (E_var ≈ 0, huge variance) and
# leaves a large, uncancelled DMC time-step bias.  The optimized trial binds the
# trion variationally with low variance, so DMC at τ = 0.05 reproduces the
# binding to ~1 meV.  Optimized E_VMC ≈ -0.01822 Ha.
project: { name: WSe2_trion, seed: 42, log: false, output: false }
system:
  lattice: { type: open, dimension: 2, L: 1.0 }
  particles:
    - { name: e, group: e_grp, type: fermions, mass: 0.34, charge: -1, up: 1, down: 1, initialization: uniform }
    - { name: h, group: h_grp, type: fermions, mass: 0.34, charge: +1, up: 1, down: 0, initialization: uniform }
wavefunction:
  - jastrow: { type: padé, pair: [e_grp, h_grp], denominator: [0.0559239, -4.7757e-05], is_fixed: [true, true, true], can_flip_sign: [false, true, true], numerator: [-0.00161114] }
  - jastrow: { type: padé, pair: [e_grp, e_grp], denominator: [0.44609, 0.0295023], is_fixed: [true, true, true], can_flip_sign: [false, true, true], numerator: [0.0667352] }
hamiltonian:
  terms:
    - { type: rytova_keldysh, pair: [e_grp, h_grp], epsilon: 1.0, r0: 85.245 }
    - { type: rytova_keldysh, pair: [e_grp, e_grp], epsilon: 1.0, r0: 85.245 }
qmc:
  - method: dmc
    random_walk: drift_diffusion
    threads: 1                 # single-thread: deterministic + avoids parallel-DMC fragility
    samples: 512
    equilibration_blocks: 256
    accumulation_blocks: 2048
    steps_per_block: 10
    sub_steps: 3
    time_step: 0.05
