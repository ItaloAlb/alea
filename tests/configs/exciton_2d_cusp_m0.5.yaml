# 2D e-h exciton, equal masses m=0.5, linear Jastrow u(r)=c·r with c=-0.5.
# Cusp satisfied (c = -m) → exact ground state, E_L constant.
# Analytic: <E_L> = c²/m + 2c = 0.5 - 1 = -0.5  (variance ≈ 0).
project: {name: exciton_2d_cusp_m05, seed: 42}
system:
  lattice: {type: open, dimension: 2, L: 1.0}
  particles:
    - {name: e, group: electron_group, type: fermions, mass: 0.5, charge: -1, up: 1, down: 0, initialization: uniform}
    - {name: h, group: hole_group, type: fermions, mass: 0.5, charge: 1, up: 1, down: 0, initialization: uniform}
wavefunction:
  - jastrow: {type: padé, pair: [electron_group, hole_group] }
hamiltonian:
  terms:
    - {type: coulomb, pair: [electron_group, hole_group], epsilon: 1.0}
qmc:
  # Zero variance at the cusp → exact for any sample size; kept small for speed.
  - {method: vmc, random_walk: metropolis, device: cpu, threads: 0, samples: 32, equilibration_blocks: 5, accumulation_blocks: 10, steps_per_block: 10, sub_steps: 2, time_step: 0.05}
