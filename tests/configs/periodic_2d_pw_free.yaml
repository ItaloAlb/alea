# ============================================================================
# NON-INTERACTING POLARISED FERMIONS IN A PERIODIC CELL — the plane-wave
# determinant's analytic anchor.
#
# With no interaction and no Jastrow, ψ = det{cos/sin(k_i·r_j)} is an EXACT
# eigenstate of the kinetic operator: every orbital satisfies ∇²φ_i = −|k_i|²φ_i,
# so the local energy is the same constant at every configuration,
#
#     E_L = Σ_i |k_i|²/2m,
#
# and VMC must return it with ZERO variance.  That single number tests the whole
# periodic-fermion stack at once — the reciprocal lattice read off the cell, the
# ± pairing into real cos/sin orbitals, the determinant's grad/lap conventions,
# and Kinetic under PBC.
#
# N = 7 fills the k = 0 orbital plus the complete first shell (6 vectors of
# |k| = 4π/(a√3)), so
#
#     E = 6 · (16π²/3a²)/2 = 16π²/a² = 8π√3/(N rs²) = 6.218741  (N=7, rs=1).
#
# An open shell is refused by construction: its energy would depend on which of
# several degenerate k-points the code happened to occupy.
# ============================================================================
project: {name: periodic_2d_pw_free, seed: 42, log: false, output: false}

system:
  lattice: {type: periodic, dimension: 2, shape: hexagonal, rs: 1.0}
  particles:
    - {name: e, group: electron_group, type: fermions, mass: 1.0, charge: -1,
       up: 7, down: 0, initialization: uniform}

wavefunction:
  - slater: {group: electron_group, orbitals: {type: plane_wave}}

hamiltonian:
  terms: []            # kinetic only (added automatically)

qmc:
  - {method: vmc, random_walk: metropolis, threads: 2, samples: 64,
     equilibration_blocks: 16, accumulation_blocks: 32,
     steps_per_block: 10, sub_steps: 2, time_step: 0.5}
