# Monolayer MoSe2 biexciton (XX = 2e + 2h): Rytova-Keldysh, Hartree a.u.
# 2 electrons (opposite spins) + 2 holes (opposite spins) -> nodeless spatial
# ground state -> DMC fixed-node-free.  Biexciton binding = 2*E(X) - E(XX).
#
# The e-h Pade has a NEGATIVE r^2 numerator term (a2<0) so u_eh ~ (a2/b1) r -> -inf:
# this LOCALIZES the 4-body complex so DMC projects the bound biexciton instead of
# dissociating to two free excitons (thesis Eqs. 3.4-3.6, p.45-46).  Parameters are
# fixed (variance/energy optimization drifts to the dissociated state); 2048 walkers
# control the population-control bias.  Matched exciton ref uses the SAME e-h Pade.
project: { name: MoSe2_biexciton, seed: 42, log: false, output: false }
system:
  lattice: { type: open, dimension: 2, L: 1.0 }
  particles:
    - { name: e, group: e_grp, type: fermions, mass: 0.54, charge: -1, up: 1, down: 1, initialization: uniform }
    - { name: h, group: h_grp, type: fermions, mass: 0.54, charge: +1, up: 1, down: 1, initialization: uniform }
wavefunction:
  - jastrow: { type: padé, pair: [e_grp, h_grp], numerator: [-0.0008], denominator: [0.02], is_fixed: [true, true], can_flip_sign: [false, true] }
  - jastrow: { type: padé, pair: [e_grp, e_grp], denominator: [0.330768, 0.019887], is_fixed: [true, true, true], can_flip_sign: [false, true, true], numerator: [0.0316976] }
  - jastrow: { type: padé, pair: [h_grp, h_grp], denominator: [0.421797, 0.032406], is_fixed: [true, true, true], can_flip_sign: [false, true, true], numerator: [0.0514473] }
hamiltonian:
  terms:
    - { type: rytova_keldysh, pair: [e_grp, h_grp], epsilon: 1.0, r0: 97.718 }
    - { type: rytova_keldysh, pair: [e_grp, e_grp], epsilon: 1.0, r0: 97.718 }
    - { type: rytova_keldysh, pair: [h_grp, h_grp], epsilon: 1.0, r0: 97.718 }
qmc:
  - { method: dmc, random_walk: drift_diffusion, threads: 0, samples: 2048, equilibration_blocks: 512, accumulation_blocks: 1024, steps_per_block: 10, sub_steps: 3, time_step: 0.05 }
