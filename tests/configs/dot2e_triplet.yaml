# ============================================================================
# Two electrons in a parabolic dot + magnetic field: spin TRIPLET, exact.
#
# m = 1, q = −1, eps = 1, B = 0.4, ω₀ = 4/15  →  W = √(ω₀² + B²/4) = 1/3.
# The centre of mass separates (Kohn); the relative problem (μ = ½) with
# angular momentum |m| = 1 has the closed-form solution
#     R = r (1 + r/3) e^{−W r²/4},   E_rel = (s+2)/(2s+1) = 1   (s = |m| = 1)
# exactly at W = 1/(2s+1) = 1/3 (a Taut-type Hooke's-atom point).  With the
# field, m = −1 is lowered by (B/2)·1, so
#     E = W + E_rel − B/2 = 1/3 + 1 − 0.2 = 17/15 = 1.133333...
# tests/references/dot_two_electron_exact.py reproduces it to 1e-10.
#
# The trial det[φ₀ φ₋₁] ∝ (z̄₁ − z̄₂)·e^{−W(r₁²+r₂²)/2} has relative angular
# momentum −1 and the exact CM state, i.e. the EXACT phase −θ_rel, so
# fixed-phase DMC is exact; the Padé Jastrow (a = 1/3 is the P-wave cusp)
# does not have the (1 + r/3) shape, so VMC is not.
# ============================================================================
project: { name: dot2e_triplet, seed: 20260929, log: false, output: false }

system:
  lattice: { type: open, dimension: 2, L: 2.0 }
  particles:
    - { name: e, group: electrons, type: fermions, mass: 1.0, charge: -1, up: 2, down: 0 }

wavefunction:
  - slater: { group: electrons, orbitals: { type: fock_darwin, l: [0, -1], beta: 0.33333333333333333 } }
  - jastrow: { type: padé, pair: [electrons, electrons], denominator: [0.8], is_fixed: [true] }

hamiltonian:
  terms:
    - { type: harmonic_trap, omega: 0.26666666666666666 }
    - { type: magnetic_field, B: 0.4 }
    - { type: coulomb, pair: [electrons, electrons], epsilon: 1.0 }

qmc:
  - { method: vmc, random_walk: metropolis, device: cpu, threads: 2, samples: 256,
      equilibration_blocks: 20, accumulation_blocks: 100, steps_per_block: 10,
      sub_steps: 2, time_step: 2.0 }
  - { method: dmc, random_walk: drift_diffusion, device: cpu, threads: 2, samples: 512,
      equilibration_blocks: 40, accumulation_blocks: 100, steps_per_block: 10,
      sub_steps: 2, time_step: 0.02 }
