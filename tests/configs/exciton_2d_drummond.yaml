# 2D e-h exciton, equal masses m=1, Drummond–Towler–Needs polynomial Jastrow.
# The cusp Γ is auto-derived from the Coulomb term: Γ = 2μ·q_e q_h/(ε(d−1)) = −1
# (μ=1/2, q_e q_h=−1, ε=1, d=2), so the e–h cusp is satisfied and E_L is finite
# at coalescence (low variance).
#
# This is a MACHINERY smoke test, not a bound-state wavefunction.  The DTN u term
# is finite-range (u≡0 beyond the cutoff L), so on its own it cannot bind a free
# e–h pair — beyond L the trial is flat and the pair is unbound, so ⟨E⟩ sits near
# the unbound limit rather than the −1 eigenvalue that the cutoff-free Padé u
# reaches.  The DTN u is a short-range correlation factor, meant to complement a
# decaying orbital / Slater part or to be cut at the Wigner–Seitz radius in
# periodic systems.
project: {name: exciton_2d_drummond, seed: 42, output: false}
system:
  lattice: {type: open, dimension: 2, L: 1.0}
  particles:
    - {name: e, group: electron_group, type: fermions, mass: 1.0, charge: -1, up: 1, down: 0, initialization: uniform}
    - {name: h, group: hole_group, type: fermions, mass: 1.0, charge: 1, up: 1, down: 0, initialization: uniform}
wavefunction:
  # params = [α0]; α1 is cusp-derived. cutoff = L (fixed here). truncation = C.
  - jastrow: {type: drummond, pair: [electron_group, hole_group], params: [0.0], is_fixed: [true], truncation: 3, cutoff: 4.0, cutoff_fixed: true}
hamiltonian:
  terms:
    - {type: coulomb, pair: [electron_group, hole_group], epsilon: 1.0}
qmc:
  - {method: vmc, random_walk: metropolis, device: cpu, threads: 0, samples: 64, equilibration_blocks: 20, accumulation_blocks: 40, steps_per_block: 20, sub_steps: 2, time_step: 0.05}
