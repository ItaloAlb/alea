# =============================================================================
# 2-D POLARIZED ELECTRON GAS — FLUID PHASE — rs = 60, N = 61
#
# The fluid half of the rs = 60 pair; run with `heg2d_crystal_rs60.yaml` (same
# cell, Hamiltonian and statistics, only the trial wavefunction differs).
#
#     ΔE(τ) = E_fluid(τ) - E_crystal(τ) > 0  ⇒  the crystal is the ground state
#
# ── Expected result (TC89, Phys. Rev. B 39, 5005, Table IV fits) ─────────────
#     N → ∞ :  ΔE ≈ +17 μHa/electron ≈ +1.0 mHa total for N = 61
# At rs = 40 the N = 61 finite-size error (mostly the fluid's plane-wave shell
# error) shifted ΔE by ≈ -11 μHa/e toward the fluid; it should shrink with rs
# (the kinetic shell error ∝ 1/rs²), so the crystal should still win here, and
# clearly. If it does not, suspect the setup before the physics.
#
# ── Units, N, Hamiltonian ────────────────────────────────────────────────────
# Hartree a.u., energies are TOTAL for the 61 electrons (divide by 61 for Ha/e,
# ×2/61 for TC89's Ry/e). N = 61: closed plane-wave shell AND Loeschian (see
# `heg2d_fluid_rs30.yaml`). One cell-wide Ewald term (Natoli-Ceperley breakup)
# with neutralizing background; ewald_tol insensitive (checked at rs = 30).
# WS inradius = 446.3 at rs = 60 (scales ∝ rs).
#
# ── Trial wavefunction ───────────────────────────────────────────────────────
# ψ = det{cos/sin(k_i·r_j)} · exp(Σ u): free-particle nodes (TC89's choice),
# nothing nodal to tune. DTN Jastrow, derived P-wave cusp (Γ = 1/3), rs = 30
# tuning c = 0.80, L = 3.5 rs carried over:
#
#     L(60)  = 210.0
#     α0(60) = 0.80 × (1/3) / (3 × 210²) = 2.0156211e-06
#
# Nodeless: any mistuning costs variance, never fixed-node energy.
#
# ── Time steps: τ = 4, 2, 1 (not 2, 1 as at rs = 40) ─────────────────────────
# At rs = 40 the crystal's time-step bias did NOT cancel: E_crystal dropped
# 0.63 mHa from τ = 2 to τ = 1 while the fluid was flat, flipping the sign of
# ΔE. The crystal bias is set by the Gaussian curvature, i.e. by τ·α: at rs = 40
# τ·α = 1.75e-3 (τ = 2) and 0.88e-3 (τ = 1). With α ∝ rs^-1.5, τ = 4, 2, 1 at
# rs = 60 give τ·α ≈ 1.9e-3, 0.95e-3, 0.48e-3 — the rs = 40 grid plus one point
# below it, at no extra cost relative to 2, 1, 0.5. sqrt(τ) = 2 << rs = 60, and
# acceptance must stay >= 0.99 (check it at τ = 4).
# THREE points so the τ → 0 extrapolation is a fit, not a two-point line:
# extrapolate each phase separately (linear in τ; check the τ = 1 point sits on
# the τ = 4/2 line), then take ΔE(0).
#
# ── Statistics ───────────────────────────────────────────────────────────────
# Plasmon relaxation t_relax ≈ 180 × (rs/30)^1.5 ≈ 510 at rs = 60, so every DMC
# block is 800 imaginary-time units (steps_per_block · sub_steps · τ), ≈ 1.6
# t_relax. 80 accumulation blocks per τ (2x rs = 40) targets ≈ ±0.06 mHa per
# phase per τ (σ² ∝ rs^-1.5 at fixed imaginary time), i.e. ≈ ±0.15-0.2 mHa on
# the extrapolated ΔE(0) against an expected ≈ +0.5-1.0 mHa. Reblock every DMC
# series with tools/reblock.py before comparing.
#
# Walkers carry over automatically between drivers, so only the first DMC needs
# a long equilibration (20 blocks = 16000 units); the later ones use 5 blocks
# (4000 units ≈ 8 t_relax) to re-equilibrate to the new τ.
#
# ── What to check ────────────────────────────────────────────────────────────
# 1. Each DMC energy below its own phase's VMC energy.
# 2. Acceptance: VMC ≈ 0.41-0.44, DMC ≥ 0.99.
# 3. acc_population fluctuates around ~1024; acc_etrial within a few mHa of
#    acc_block_energy.
# 4. Crystal: 61 sharp density peaks. Fluid: the DMC density map WILL show weak
#    random crystalline patches (slow centre-of-mass diffusion, seen at rs = 40);
#    that is a sampling artifact, not freezing — use g(r) for the fluid.
#
# ── Expected cost (from the rs = 40 timings, 128 cores) ──────────────────────
# ≈ 0.34 s per DMC sub-step (fluid), 0.58 s (crystal); 122 000 sub-steps per
# phase ⇒ fluid ≈ 12 h, crystal ≈ 20 h DMC + ≈ 5.5 h optimizer. Inside 72 h.
# =============================================================================
project:
  name: heg2d_fluid_rs60
  seed: 20260923
  log: true
  output: true

system:
  lattice:
    type: periodic
    dimension: 2
    shape: hexagonal
    rs: 60.0
    ewald_tol: 1.0e-6
  particles:
    - { name: e, group: electron_group, type: fermions, mass: 1.0, charge: -1,
        up: 61, down: 0, initialization: uniform }

wavefunction:
  - slater:
      group: electron_group
      orbitals: { type: plane_wave }
  - jastrow:
      type: drummond
      pair: [electron_group, electron_group]
      params: [2.0156211e-06]       # α0 = c·Γ/(3L²), c = 0.80
      is_fixed: [true]
      truncation: 3
      cutoff: 210.0                 # L = 3.5 x rs, inside the WS inradius 446.3
      cutoff_fixed: true

hamiltonian:
  terms:
    - { type: coulomb, pair: [electron_group, electron_group], epsilon: 1.0 }

qmc:
  # 1. Variational reference. time_step = 150 × (60/30)² = 600 (proposal
  #    variance, not imaginary time).
  - method: vmc
    random_walk: metropolis
    device: cpu
    threads: 0
    samples: 1024
    equilibration_blocks: 40
    accumulation_blocks: 200
    steps_per_block: 10
    sub_steps: 2
    time_step: 600.0
    estimators:
      - { type: gofr, rmax: 440.0, n_bins: 110 }
      - { type: density, rmax: 446.0, n_bins: 48 }

  # 2-4. Fixed-node DMC at τ = 4, 2, 1, 800 imaginary-time units per block.
  - method: dmc
    random_walk: drift_diffusion
    device: cpu
    threads: 0
    samples: 1024
    equilibration_blocks: 20
    accumulation_blocks: 80
    steps_per_block: 100
    sub_steps: 2
    time_step: 4.0
    walkers_out: heg2d_fluid_rs60_tau4.h5
    estimators:
      - { type: gofr, rmax: 440.0, n_bins: 110 }
      - { type: density, rmax: 446.0, n_bins: 48 }

  - method: dmc
    random_walk: drift_diffusion
    device: cpu
    threads: 0
    samples: 1024
    equilibration_blocks: 5
    accumulation_blocks: 80
    steps_per_block: 200
    sub_steps: 2
    time_step: 2.0
    walkers_out: heg2d_fluid_rs60_tau2.h5
    estimators:
      - { type: gofr, rmax: 440.0, n_bins: 110 }
      - { type: density, rmax: 446.0, n_bins: 48 }

  - method: dmc
    random_walk: drift_diffusion
    device: cpu
    threads: 0
    samples: 1024
    equilibration_blocks: 5
    accumulation_blocks: 80
    steps_per_block: 400
    sub_steps: 2
    time_step: 1.0
    walkers_out: heg2d_fluid_rs60_tau1.h5
    estimators:
      - { type: gofr, rmax: 440.0, n_bins: 110 }
      - { type: density, rmax: 446.0, n_bins: 48 }
