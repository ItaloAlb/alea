# ============================================================================
# INDIRECT (interlayer) exciton in an hBN-encapsulated MoS2 BILAYER — testbed.
# Screened-Coulomb (fast-screened-coulomb / ETM).  Hartree atomic units (Bohr, Ha).
#
# One electron in the BOTTOM MoS2 layer + one hole in the TOP MoS2 layer → a
# spatially-indirect exciton.  The screened term carries the out-of-plane charge
# separation in its FIT (source layer 2 → target layer 3, z_offset = T); the particle
# z is irrelevant in this 2D sim, so it is left at 0 (avoids the redundant-offset trap).
#
# Two-stage run (chained on the SAME trial wavefunction by App::run):
#   1. method: optimizer — linear method optimizes the Padé a₂,b₁ (signs LOCKED:
#      can_flip_sign=false; with free signs the optimizer drives b₁<0 → Padé pole →
#      garbage).  It updates the shared ψ in place.
#   2. method: dmc — projects the ground state using the OPTIMIZED ψ.
#
# Physical inputs (MoS2 / hBN):
#   layer/interlayer thickness  T = 6 Å = 11.338 Bohr   (1 Bohr = 0.529177 Å)
#   slab dielectric  ε_slab = 14 ;  hBN environment  ε_env = 4.5
#   masses  mₑ = 0.49 , m_h = 0.35  (electron-mass units; μ ≈ 0.204)
#   interfaces (electron-layer frame) = [-T/2, T/2, 3T/2] = [-5.669, 5.669, 17.007]
#
# NOTE: this exciton is very DIFFUSE and weakly bound; the single-τ DMC energy is NOT
# converged (tiny gap → slow projection + large τ-bias).  For a real number, lengthen
# projection and extrapolate τ→0.  The VMC bound from the optimizer (≤ ~−0.004 Ha)
# already proves it binds.
# ============================================================================
project:
  name: exciton_indirect_bilayerMoS2
  seed: 42
  log: true
  output: true

system:
  lattice: { type: open, dimension: 2, L: 50.0 }   # large box for the diffuse exciton
  particles:
    - { name: e, group: electron_group, type: fermions, mass: 0.49, charge: -1, up: 1, down: 0, z: 0.0, initialization: uniform }
    - { name: h, group: hole_group,     type: fermions, mass: 0.35, charge: +1, up: 1, down: 0, z: 0.0, initialization: uniform }

wavefunction:
  - jastrow:
      type: padé
      pair: [electron_group, hole_group]
      numerator: [-0.01]
      denominator: [0.02]
      is_fixed: [false, false]
      can_flip_sign: [false, false]

hamiltonian:
  terms:
    # e–h INTERLAYER: charge in layer 2 (electron), observed in layer 3 (hole),
    # out-of-plane offset z_offset = T = 11.338 Bohr baked into the fit.
    - type: screened_coulomb
      pair: [electron_group, hole_group]
      epsilons:   [4.5, 14.0, 14.0, 4.5]          # hBN / MoS2 / MoS2 / hBN
      interfaces: [-5.669, 5.669, 17.007]          # [-T/2, T/2, 3T/2], Bohr
      source_layer: 2
      target_layer: 3
      z_offset: 11.338                              # T = 6 Å in Bohr
      fit_tol: 0.1

qmc:
  - method: optimizer
    type: linear
    random_walk: langevin
    device: cpu
    threads: 0
    samples: 1024
    equilibration_blocks: 512
    accumulation_blocks: 1024
    steps_per_block: 10
    sub_steps: 3
    time_step: 0.02
    max_iterations: 40
    energy_tol: 1e-7
    num_shifts: 3
    max_param_change: 0.2
    cost_increase_tol: 0.0
    target_shift_i: -1.0
    max_failed_attempts: 5
    shift_i: 0.1
    shift_s: 0.0
    rescale: 0.5

  - method: dmc
    random_walk: drift_diffusion
    device: cpu
    threads: 0
    samples: 1024
    equilibration_blocks: 1024
    accumulation_blocks: 2048
    steps_per_block: 10
    sub_steps: 3
    time_step: 0.01
