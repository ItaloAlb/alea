project:
  name: biexciton
  seed: 42
  log: true

system:
  lattice:
    type: open
    dimension: 2
    L: 1.0

  particles:
    - name: e
      group: electron_group
      type: fermions
      mass: 1.0
      charge: -1
      up: 1
      down: 1
      initialization: uniform

    - name: h
      group: hole_group
      type: fermions
      mass: 1.0
      charge: +1
      up: 1
      down: 1
      initialization: uniform

wavefunction:
  - jastrow:
      type: padé
      pair: [electron_group, hole_group]
      # Kato cusp 2D: a_1 = 2·μ·q_e·q_h / (ε·(d-1))
      #   = 2·0.5·(-1)(+1) / 1 = -1
      # Fix a_1 to cusp, optimise the rest for long-range saturation.
      numerator: [0.0]
      denominator: [0.0, 0.0]
      is_fixed: [false, false, false]
      can_flip_sign: [true, false, false]

  - jastrow:
      type: padé
      pair: [electron_group, electron_group]
      # Kato cusp 2D: a_1 = 2·μ·q_e² / (ε·(d-1))
      #   = 2·0.5·1 / 1 = +1.0
      # Fix a_1 to prevent optimiser from finding unphysical large values
      # that destabilise Langevin dynamics and DMC branching.
      # u(r) = (a_1·r + a_2·r²) / (1 + b_1·r + b_2·r²)
      # Initial: u(r) = r/(1+r)  →  cusp +1 at r=0, saturates to +1 at r→∞.
      numerator: [0.0]
      denominator: [1.0, 0.0]
      is_fixed: [false, false, false]
      can_flip_sign: [true, false, false]


  - jastrow:
      type: padé
      pair: [hole_group, hole_group]
      # Kato cusp 2D: a_1 = 2·μ·q_h² / (ε·(d-1))
      #   = 2·0.5·1 / 1 = +1.0
      # Fix a_1 to prevent optimiser from finding unphysical large values
      # that destabilise Langevin dynamics and DMC branching.
      # u(r) = (a_1·r + a_2·r²) / (1 + b_1·r + b_2·r²)
      # Initial: u(r) = r/(1+r)  →  cusp +1 at r=0, saturates to +1 at r→∞.
      numerator: [0.0]
      denominator: [1.0, 0.0]
      is_fixed: [false, false, false]
      can_flip_sign: [true, false, false]


hamiltonian:
  terms:
    - type: coulomb
      pair: [electron_group, hole_group]
      epsilon: 1.0
    - type: coulomb
      pair: [electron_group, electron_group]
      epsilon: 1.0
    - type: coulomb
      pair: [hole_group, hole_group]
      epsilon: 1.0

qmc:
  - method: optimizer
    type: linear
    random_walk: langevin
    device: cpu
    threads: 0
    samples: 512
    equilibration_blocks: 256
    accumulation_blocks: 2048
    steps_per_block: 20
    sub_steps: 5
    time_step: 0.01
    max_iterations: 30
    energy_tol: 1e-6
    num_shifts: 3
    max_param_change: 0.3
    cost_increase_tol: 0.0
    target_shift_i: -1.0
    max_failed_attempts: 5
    shift_i: 0.1
    shift_s: 0.0
    rescale: 0.5

  - method: vmc
    random_walk: langevin # type of random walk used to the new proposed move. Options are: "langevin" and "metropolis".
    device: cpu # for now, only cpu execution should be avaiable, but gpu support is planned for the future.
    threads: 0  # use all available CPU cores
    samples: 512 # number of walkers used in the WalkerEnsemble.
    equilibration_blocks: 512 # number of blocks used for equilibration, dont contribute to the statistics.
    accumulation_blocks: 2048 # number of blocks used to accumulate statistics and the total number of samples.
    steps_per_block: 100 # number of steps per block, used to evaluate the mean of each block.
    sub_steps: 10 # number of sub-steps: steps that dont contribute to the statistics but are used to decorrelate the samples.
    time_step: 0.01

  - method: dmc
    random_walk: langevin
    device: cpu
    threads: 0
    samples: 2048
    equilibration_blocks: 512
    accumulation_blocks: 2048
    steps_per_block: 100
    sub_steps: 10
    time_step: 0.01
