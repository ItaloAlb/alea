# Experimental numerical pair backend: refine domain and spacing separately.
# Identity connectivity samples distinguishable particles; no exchange or nodes.
project: {name: pimc_pair_product_experimental, seed: 930043, output: true, log: false}
system:
  lattice: {type: open, dimension: 2, L: 0.5}
  particles:
    - {name: e, group: electrons, type: boltzmannon, mass: 1, charge: -1, up: 3, down: 0}
    - {name: h, group: holes, type: boltzmannon, mass: 2, charge: 1, up: 3, down: 0}
hamiltonian:
  terms:
    - {type: harmonic_trap, omega: 1}
    - {type: coulomb, pair: [electrons, electrons], epsilon: 4}
    - {type: coulomb, pair: [holes, holes], epsilon: 4}
    - {type: coulomb, pair: [electrons, holes], epsilon: 4}
action:
  - kinetic: primitive
  # extent bounds each coordinate of a relative endpoint, not absolute positions.
  - pair_product: {form: finite_grid, extent: 3, grid_points: 17}
qmc:
  - method: pimc
    threads: 4
    samples: 8
    beta: 0.5
    time_step: 0.125
    equilibration_blocks: 32
    accumulation_blocks: 64
    steps_per_block: 8
    sub_steps: 2
    energy: thermodynamic
    moves:
      - bisection: {levels: 2, weight: 1}
      - centroid: {step: 0.3, weight: 1}
      - single_slice: {step: 0.2, weight: 1}
